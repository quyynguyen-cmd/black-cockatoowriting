document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <button type=\"button\" sc-camel-on-click=\"{{ quit }}\" style=\"margin-top: 10px; width: 100%; height: 44px; font-size: 15px; color: #7d786c; background: none; border: none; cursor: pointer;\">Back<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isTeacher }}\" hint-placeholder-val=\"\">\n    <div data-screen-label=\"Teacher view\">\n      <div data-noprint=\"1\" style=\"background: #fff; border-bottom: 1px solid #e4ded1; padding: 18px 24px;\">\n        <div style=\"max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;\">\n          <div style=\"font-family: 'Bricolage Grotesque', Georgia, serif; font-size: 22px; font-weight: 700;\">Student writing<\u002Fdiv>\n          <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #7d786c;\">{{ teacherCount }}<\u002Fdiv>\n          <div style=\"flex: 1;\"><\u002Fdiv>\n          <button type=\"button\" sc-camel-on-click=\"{{ exportCsv }}\" style=\"min-height: 40px; padding: 0 14px; font-size: 15px; background: #f7f4ed; border: 1px solid #e4ded1; border-radius: 8px; cursor: pointer;\">Export CSV<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ printPage }}\" style=\"min-height: 40px; padding: 0 14px; font-size: 15px; background: #f7f4ed; border: 1px solid #e4ded1; border-radius: 8px; cursor: pointer;\">Print / PDF<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ quit }}\" style=\"min-height: 40px; padding: 0 14px; font-size: 15px; background: #f7f4ed; border: 1px solid #e4ded1; border-radius: 8px; cursor: pointer;\">Exit<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"max-width: 1180px; margin: 0 auto; padding: 26px 24px 60px;\">\n        <sc-if value=\"{{ teacherEmpty }}\" hint-placeholder-val=\"\">\n          <div style=\"background: #fff; border: 1px dashed #ddd6c7; border-radius: 16px; padding: 40px; text-align: center; color: #55524a;\">No  solid #cbdccf; border-radius: 9px; font-size: 15px; color: #24503c;\">{{ serverStatus }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n          <sc-for list=\"{{ teacherRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n            <div style=\"background: #fff; border: 1px solid #e4ded1; border-radius: 16px; padding: 24px 26px;\">\n              <div style=\"display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 1px solid #efe9dd;\">\n                <div style=\"font-family: 'Bricolage Grotesque', Georgia, serif; font-size: 22px; font-weight: 700;\">{{ r.name }}<\u002Fdiv>\n                <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #7d786c;\">{{ r.meta }}<\u002Fdiv>\n                <div style=\"flex: 1;\"><\u002Fdiv>\n                <div style=\"font-size: 15px; color: #b4671f;\">{{ r.flags }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 16px;\">\n                <sc-for list=\"{{ r.pieces }}\" as=\"p\" hint-placeholder-count=\"3\">\n                  <div>\n                    <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #7d786c; margin-bottom: 7px;\">{{ p.label }}<\u002Fdiv>\n                    <div style=\"font-size: 16px; line-height: 1.6; color: #21201b; padding: 12px 14px; background: #faf8f2; border-radius: 10px; text-wrap: pretty;\">{{ p.text }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ hasWork }}\" hint-placeholder-val=\"\">\n          <div data-noprint=\"1\" style=\"margin-top: 26px; display: flex; gap: 10px; align-items: center;\">\n            <button type=\"button\" sc-camel-on-click=\"{{ clearWork }}\" style=\"min-height: 40px; padding: 0 14px; font-size: 14px; color: #9c3b2e; background: #fff; border: 1px solid #e6cec9; border-radius: 9px; cursor: pointer;\">Clear all work<\u002Fbutton>\n            <div style=\"font-size: 14px; color: #8d8779;\">Saved on this device.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;teacherPassword&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;teacher2026&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Settings&quot;},&quot;apiBase&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Settings&quot;}}\">\nconst KEY = 'teal.writing.cockatoo.v1';\nconst API_KEY = 'teal.writing.api';\n\nconst S1 = [\n  [\"Carnaby's black cockatoo is found only in the south-west of Western Australia.\", 'fact', 'This can be checked in a field guide or on a map. Facts like this belong in a report.'],\n  ['Black cockatoos are the most beautiful birds in Australia.', 'opinion', '\"Most beautiful\" is what someone thinks. Another person could disagree, so it cannot be proven.'],\n  ['Black cockatoos nest in hollows of large, old eucalypt trees.', 'fact', 'Scientists have observed this and recorded it. It can be checked.'],\n  ['Everyone should own a pet cockatoo.', 'opinion', 'The word \"should\" tells you someone is giving advice, not information.'],\n  [\"A Carnaby's black cockatoo can live for more than 40 years.\", 'fact', 'Researchers have measured this by tracking birds over time.'],\n  ['Their loud call is annoying early in the morning.', 'opinion', '\"Annoying\" is a feeling. Some people love the sound.'],\n  [\"Carnaby's black cockatoo is listed as endangered.\", 'fact', 'This is an official classification. You can look it up.'],\n  ['I think black cockatoos are cleverer than other birds.', 'opinion', 'It starts with \"I think\" — a clear signal that this is a personal view.']\n];\n\nconst S2 = [\n  ['Black cockatoos eat seeds from marri, jarrah and banksia trees.', true, 'A fact about the topic — this belongs.'],\n  ['My uncle saw one in his garden last week.', false, 'A personal story. Information reports describe the whole species, not one person\\u2019s experience.'],\n  [\"Carnaby's black cockatoo has a short, blunt beak for cracking hard seeds.\", true, 'A fact about the topic — this belongs.'],\n  ['They are the cutest birds you will ever see.', false, 'An opinion. \"Cutest\" cannot be proven.'],\n  ['Females usually lay one or two eggs, and often only one chick survives.', true, 'A fact about the topic — this belongs.'],\n  ['Perth is the capital city of Western Australia.', false, 'True, but it is not about black cockatoos. Keep a report on its topic.'],\n  ['Land clearing has destroyed much of their feeding and nesting habitat.', true, 'A fact about the topic — this belongs.'],\n  [\"Black cockatoos should be everyone's favourite bird.\", false, '\"Should\" and \"favourite\" signal an opinion.']\n];\n\nconst S3 = [\n  { label: 'Sentence 1 of 3', notes: ['black cockatoo', 'wingspan about 110 cm', 'large bird'] },\n  { label: 'Sentence 2 of 3', notes: ['nests in tree hollows', 'hollows form in old eucalypts', 'can take over 100 years'] },\n  { label: 'Sentence 3 of 3', notes: [\"Carnaby's black cockatoo\", 'endangered', 'land clearing'] }\n];\n\nconst WORD_BANK = ['habitat', 'woodland', 'eucalypt', 'hollow', 'marri', 'jarrah', 'banksia', 'seeds', 'native', 'species', 'endangered', 'wingspan'];\n\nconst TOPIC_WORDS = ['cockatoo', 'cockatoos', 'carnaby', \"carnaby's\", 'baudin', \"baudin's\", 'endangered', 'habitat', 'hollow', 'hollows', 'eucalypt', 'eucalypts', 'marri', 'jarrah', 'banksia', 'seeds', 'seed', 'beak', 'feathers', 'wingspan', 'native', 'species', 'breeding', 'nest', 'nests', 'nesting', 'conservation', 'threatened', 'forest', 'woodland', 'flock', 'chick', 'chicks', 'australia', 'australian', 'western'];\n\nconst MISSPELL = {\n  alot: 'a lot', allot: 'a lot', becuase: 'because', becouse: 'because', becasue: 'because',\n  thier: 'their', recieve: 'receive', seperate: 'separate', definately: 'definitely',\n  enviroment: 'environment', environmnet: 'environment', beleive: 'believe', freind: 'friend',\n  wich: 'which', teh: 'the', adn: 'and', hav: 'have', wen: 'when', whith: 'with',\n  cocatoo: 'cockatoo', cockato: 'cockatoo', cocktoo: 'cockatoo', cockatooo: 'cockatoo',\n  cocatoos: 'cockatoos', habitiat: 'habitat', habbitat: 'habitat', endangerd: 'endangered',\n  endangred: 'endangered', eucalipt: 'eucalypt', eucalpt: 'eucalypt', speices: 'species',\n  specie: 'species', bannksia: 'banksia', banskia: 'banksia', jarah: 'jarrah', marrie: 'marri',\n  nestes: 'nests', feathrs: 'feathers', wingspann: 'wingspan', australlia: 'Australia',\n  austrailia: 'Australia', forrest: 'forest', tre: 'tree', tress: 'trees', birdz: 'birds'\n};\n\nconst OPINION_WORDS = ['i think', 'i believe', 'i feel', 'in my opinion', 'i reckon', 'my favourite', 'favourite', 'favorite', 'best', 'worst', 'beautiful', 'amazing', 'cute', 'cutest', 'ugly', 'boring', 'interesting', 'should', 'must', 'awesome', 'cool', 'nice', 'lovely', 'wonderful', 'terrible', 'horrible', 'prettiest', 'adorable', 'scary', 'sadly', 'luckily', 'unfortunately', 'i love', 'i hate', 'everyone knows'];\n\nconst FIRST_PERSON = ['i ', ' i ', ' my ', ' me ', ' we ', ' our ', ' us '];\n\nconst PROPER = { australia: 'Australia', australian: 'Australian', perth: 'Perth', \"carnaby's\": \"Carnaby's\", carnaby: 'Carnaby', \"baudin's\": \"Baudin's\", baudin: 'Baudin' };\n\nconst CHIP = {\n  Facts: ['#fdf1e6', '#a35a12'], Opinion: ['#fdf1e6', '#a35a12'], Spelling: ['#fdf0ee', '#9c3b2e'],\n  Punctuation: ['#eef2fb', '#3d5591'], Structure: ['#eef4ef', '#24503c'], Vocabulary: ['#f5f0f7', '#6b4084'],\n  Length: ['#f4f2ec', '#5f5a4d'], Great: ['#eef4ef', '#24503c']\n};\n\nfunction lev(a, b) {\n  const m = [];\n  for (let i = 0; i <= b.length; i++) m[i] = [i];\n  for (let j = 0; j <= a.length; j++) m[0][j] = j;\n  for (let i = 1; i <= b.length; i++)\n    for (let j = 1; j <= a.length; j++)\n      m[i][j] = b[i - 1] === a[j - 1] ? m[i - 1][j - 1]\n        : Math.min(m[i - 1][j - 1] + 1, m[i][j - 1] + 1, m[i - 1][j] + 1);\n  return m[b.length][a.length];\n}\n\nfunction sentencesOf(t) {\n  return String(t).split(/(?<=[.!?])\\s+/).map(s => s.trim()).filter(Boolean);\n}\n\nclass Component extends DCLogic {\n  state = {\n    view: 'login', nameInput: '', nameError: '', username: '', stage: 0,\n    s1: {}, s2sel: {}, s2checked: false,\n    s3round: 0, s3draft: '', s3fb: null, s3rev: '', s3final: null,\n    s4draft: '', s4fb: null, s4rev: '', s4final: null,\n    busy: false, pwInput: '', pwError: false, work: {}, apiInput: '', apiBase: '',\n    serverWork: {}, serverStatus: '', pwUsed: ''\n  };\n\n  componentDidMount() {\n    const d = this.load();\n    let api = '';\n    try { api = localStorage.getItem(API_KEY) || ''; } catch (e) {}\n    if (!api) api = this.props.apiBase ?? '';\n    this.setState({ work: d.work || {}, apiBase: api, apiInput: api });\n  }\n\n  load() { try { return JSON.parse(localStorage.getItem(KEY)) || { work: {} }; } catch (e) { return { work: {} }; } }\n  saveAll(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} }\n\n  saveWork(patch) {\n    const d = this.load();\n    d.work = d.work || {};\n    const rec = Object.assign({ username: this.state.username, updatedAt: Date.now() }, d.work[this.state.username] || {}, patch, { updatedAt: Date.now() });\n    d.work[this.state.username] = rec;\n    this.saveAll(d);\n    this.setState({ work: d.work });\n    this.pushToServer(rec);\n  }\n\n  pushToServer(rec) {\n    const base = (this.state.apiBase || '').replace(/\\/+$/, '');\n    if (!base || !rec || !rec.username) return;\n    fetch(base + '/api/writing-submit', {\n      method: 'POST', headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify({ username: rec.username, finished: !!rec.finished, activity: 'cockatoo-report', payload: rec })\n    }).catch(() => {});\n  }\n\n  loadClassFromServer() {\n    const base = (this.state.apiBase || '').replace(/\\/+$/, '');\n    if (!base) return this.setState({ serverStatus: '' });\n    this.setState({ serverStatus: 'Loading the class from your server…' });\n    fetch(base + '/api/writing-class?activity=cockatoo-report&password=' + encodeURIComponent(this.state.pwUsed || ''))\n      .then(r => r.ok ? r.json() : Promise.reject(r.status))\n      .then(j => {\n        const map = {};\n        (j.students || []).forEach(s => { if (s.username) map[s.username] = s; });\n        this.setState({\n          serverWork: map,\n          serverStatus: (j.students || []).length + ' students loaded from your server.'\n        });\n      })\n      .catch(err => this.setState({\n        serverStatus: err === 401\n          ? 'The server rejected that password. Check TEACHER_PASSWORD on Render matches the one you just typed.'\n          : 'Could not reach your server, so this is showing work saved on this device only.'\n      }));\n  }\n\n  check(text, opts) {\n    const t = String(text || '').trim();\n    const lower = ' ' + t.toLowerCase() + ' ';\n    const words = t.split(/\\s+/).filter(Boolean);\n    const sents = sentencesOf(t);\n    const points = [], good = [];\n    const target = (opts && opts.target) || 0;\n\n    const opinions = OPINION_WORDS.filter(w => lower.indexOf(' ' + w) > -1 || lower.indexOf(w + ' ') > -1);\n    if (opinions.length) {\n      points.push({ category: 'Opinion', text: 'You used ' + opinions.slice(0, 2).map(w => '\"' + w + '\"').join(' and ') + '. That tells the reader what you think, and an information report only gives facts the reader can check. Try swapping it for something you could prove.' });\n    } else good.push('you kept it factual');\n\n    const fp = FIRST_PERSON.filter(w => lower.indexOf(w) > -1);\n    if (fp.length && !opinions.length) {\n      points.push({ category: 'Facts', text: 'Words like \"I\", \"we\" or \"my\" put you in the writing. Information reports stay on the topic — write about the cockatoos, not about yourself.' });\n    }\n\n    const misspelt = [];\n    words.forEach(w => {\n      const clean = w.toLowerCase().replace(/[^a-z']/g, '');\n      if (!clean) return;\n      if (MISSPELL[clean]) { misspelt.push([w, MISSPELL[clean]]); return; }\n      if (clean.length >= 5 && TOPIC_WORDS.indexOf(clean) < 0) {\n        for (let i = 0; i < TOPIC_WORDS.length; i++) {\n          const tw = TOPIC_WORDS[i];\n          if (Math.abs(tw.length - clean.length) <= 2 && lev(clean, tw) === 1) { misspelt.push([w, tw]); break; }\n        }\n      }\n    });\n    if (misspelt.length) {\n      points.push({ category: 'Spelling', text: 'Check ' + misspelt.slice(0, 3).map(m => '\"' + m[0] + '\" (try ' + m[1] + ')').join(', ') + '.' });\n    } else if (words.length > 6) good.push('your spelling is accurate');\n\n    const punct = [];\n    sents.forEach(s => {\n      if (!/^[A-Z\"']/.test(s)) punct.push('start every sentence with a capital letter');\n      if (!/[.!?][\"']?$/.test(s)) punct.push('finish every sentence with a full stop');\n    });\n    if (/\\bi\\b/.test(t)) punct.push('the word \"I\" is always a capital letter');\n    Object.keys(PROPER).forEach(k => {\n      const re = new RegExp('\\\\b' + k.replace(\"'\", \"'\") + '\\\\b');\n      if (re.test(t) && !new RegExp('\\\\b' + PROPER[k].replace(\"'\", \"'\") + '\\\\b').test(t)) {\n        punct.push(PROPER[k] + ' is a naming word, so it needs a capital letter');\n      }\n    });\n    if (/\\s+[,.]/.test(t)) punct.push('there is a space before a full stop or comma — take it out');\n    const uniquePunct = punct.filter((v, i, a) => a.indexOf(v) === i);\n    if (uniquePunct.length) {\n      points.push({ category: 'Punctuation', text: 'Two things to fix: ' + uniquePunct.slice(0, 2).join(', and ') + '.' });\n    } else if (sents.length) good.push('your punctuation is correct');\n\n    const tech = WORD_BANK.filter(w => lower.indexOf(w) > -1);\n    if (tech.length >= 2) good.push('you used the topic words ' + tech.slice(0, 3).join(', '));\n    else if (words.length > 10) {\n      points.push({ category: 'Vocabulary', text: 'Add a precise word from the word bank — words like habitat, eucalypt or banksia tell the reader exactly what you mean.' });\n    }\n\n    if (target) {\n      if (sents.length < target) points.push({ category: 'Length', text: 'You have written ' + sents.length + ' sentence' + (sents.length === 1 ? '' : 's') + '. The task asks for ' + target + '. Add ' + (target - sents.length) + ' more.' });\n      else good.push('you wrote the full ' + target + ' sentences');\n      if (sents.length >= 2) {\n        const first = sents[0].toLowerCase();\n        if (first.indexOf('cockatoo') < 0) {\n          points.push({ category: 'Structure', text: 'Your first sentence is the topic sentence — it should tell the reader straight away that this paragraph is about black cockatoos.' });\n        } else good.push('your topic sentence names the subject');\n        const starts = sents.map(s => s.split(/\\s+/)[0].toLowerCase());\n        if (starts.length >= 3 && starts[0] === starts[1] && starts[1] === starts[2]) {\n          points.push({ category: 'Structure', text: 'Every sentence starts with \"' + sents[0].split(/\\s+/)[0] + '\". Change one so the paragraph flows better.' });\n        }\n      }\n    } else if (words.length && words.length < 6) {\n      points.push({ category: 'Length', text: 'That is quite short. Use more of the notes so the reader gets the full picture.' });\n    }\n\n    if (opts && opts.notes) {\n      const missed = opts.notes.filter(n => {\n        const key = n.toLowerCase().replace(/[^a-z ]/g, '').split(' ').filter(w => w.length > 3)[0];\n        return key && lower.indexOf(key) < 0;\n      });\n      if (missed.length) points.push({ category: 'Facts', text: 'You have not used this note yet: \"' + missed[0] + '\". Every note holds a fact the reader needs.' });\n      else good.push('you used all the notes');\n    }\n\n    let praise;\n    if (!t) praise = 'Write something first, then I can help.';\n    else if (!points.length) praise = 'This is ready — ' + (good.slice(0, 2).join(' and ') || 'well written') + '.';\n    else praise = 'Good start — ' + (good.slice(0, 2).join(' and ') || 'you have made a solid attempt') + '.';\n\n    return {\n      praise,\n      points: points.slice(0, 2),\n      nextStep: points.length ? 'Fix the ' + (points.length === 1 ? 'point' : 'points') + ' above, then write it again below.' : ''\n    };\n  }\n\n  async getFeedback(payload) {\n    const base = (this.state.apiBase || '').replace(/\\/+$/, '');\n    if (base) {\n      try {\n        const res = await fetch(base + '/api/writing-feedback', {\n          method: 'POST', headers: { 'Content-Type': 'application/json' },\n          body: JSON.stringify(Object.assign({ topic: 'Australian black cockatoo', yearLevel: 5, tone: 'gentle' }, payload))\n        });\n        if (res.ok) {\n          const j = await res.json();\n          if (j && j.praise && Array.isArray(j.points)) return j;\n        }\n      } catch (e) {}\n    }\n    return this.check(payload.text, { target: payload.targetSentences, notes: payload.notes });\n  }\n\n  run(payload, key) {\n    this.setState({ busy: true });\n    this.getFeedback(payload).then(fb => {\n      this.setState({ busy: false, [key]: fb });\n      this.saveWork(payload.stage === 'paragraph'\n        ? (key === 's4fb' ? { s4draft: payload.text } : { s4rev: payload.text })\n        : (key === 's3fb' ? { ['s3draft' + payload.round]: payload.text } : { ['s3rev' + payload.round]: payload.text }));\n    });\n  }\n\n  chip(cat) { const c = CHIP[cat] || CHIP.Great; return { chipBg: c[0], chipFg: c[1] }; }\n  decorate(fb) {\n    if (!fb) return null;\n    return { praise: fb.praise, nextStep: fb.nextStep || '', points: (fb.points || []).map(p => Object.assign({}, p, this.chip(p.category))) };\n  }\n\n  renderVals() {\n    const st = this.state;\n    const s1Answered = Object.keys(st.s1).length;\n    const s1Right = S1.filter((it, i) => st.s1[i] === it[1]).length;\n    const s2Right = S2.filter((it, i) => !!st.s2sel[i] === it[1]).length;\n    const round = S3[st.s3round] || S3[0];\n    const merged = {};\n    Object.keys(st.work).forEach(k => { merged[k] = Object.assign({}, st.work[k], { source: 'this device' }); });\n    Object.keys(st.serverWork).forEach(k => {\n      const s = st.serverWork[k], local = merged[k];\n      if (!local || (s.updatedAt || 0) >= (local.updatedAt || 0)) merged[k] = Object.assign({}, s, { source: 'server' });\n    });\n    const workList = Object.keys(merged).map(k => merged[k]).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));\n\n    return {\n      isLogin: st.view === 'login', isApp: st.view === 'app', isDone: st.view === 'done',\n      isTeacherLogin: st.view === 'teacher-login', isTeacher: st.view === 'teacher',\n      nameInput: st.nameInput, nameError: st.nameError,\n      onNameInput: e => this.setState({ nameInput: e.target.value, nameError: '' }),\n      onNameKey: e => { if (e.key === 'Enter') { e.preventDefault(); this.startFn(); } },\n      start: () => this.startFn(),\n      resumeNote: (() => {\n        const w = st.work[st.nameInput.trim()];\n        return w ? 'Welcome back — your earlier writing is saved.' : '';\n      })(),\n      goTeacher: () => this.setState({ view: 'teacher-login', pwInput: '', pwError: false }),\n      username: st.username,\n      firstName: (st.username || '').split('.')[0],\n      quit: () => this.setState({ view: 'login', nameInput: '', username: '', stage: 0, s1: {}, s2sel: {}, s2checked: false, s3round: 0, s3draft: '', s3fb: null, s3rev: '', s3final: null, s4draft: '', s4fb: null, s4rev: '', s4final: null }),\n\n      stageLabel: ['Fact or opinion', 'Choosing facts', 'Writing sentences', 'Your paragraph'][st.stage],\n      stageDots: [0, 1, 2, 3].map(i => ({ color: i < st.stage ? '#1e3a2f' : i === st.stage ? '#b4671f' : '#e4ded1' })),\n      isStage1: st.stage === 0, isStage2: st.stage === 1, isStage3: st.stage === 2, isStage4: st.stage === 3,\n      nextStage: () => this.setState({ stage: st.stage + 1 }),\n\n      s1Items: S1.map((it, i) => {\n        const picked = st.s1[i];\n        const correct = picked === it[1];\n        return {\n          text: it[0], showWhy: !!picked, why: correct ? it[2] : 'Not quite. ' + it[2],\n          whyBg: picked ? (correct ? '#eef4ef' : '#fdf1e6') : '#fff',\n          whyBorder: correct ? '#4b7f5f' : '#b4671f',\n          border: picked ? (correct ? '#cbdccf' : '#f0dcc4') : '#e4ded1',\n          pickFact: () => this.setState({ s1: Object.assign({}, st.s1, { [i]: 'fact' }) }),\n          pickOpinion: () => this.setState({ s1: Object.assign({}, st.s1, { [i]: 'opinion' }) }),\n          factBg: picked === 'fact' ? '#1e3a2f' : '#fff', factFg: picked === 'fact' ? '#fff' : '#21201b',\n          factBorder: picked === 'fact' ? '#1e3a2f' : '#ddd6c7',\n          opBg: picked === 'opinion' ? '#1e3a2f' : '#fff', opFg: picked === 'opinion' ? '#fff' : '#21201b',\n          opBorder: picked === 'opinion' ? '#1e3a2f' : '#ddd6c7'\n        };\n      }),\n      s1Progress: s1Answered ? s1Right + ' of ' + s1Answered + ' correct so far' : 'Choose fact or opinion for each one.',\n      s1NextLabel: s1Answered >= S1.length ? 'Next: choosing facts' : 'Skip to next activity',\n      s1NextBg: s1Answered >= S1.length ? '#1e3a2f' : '#7d786c',\n\n      s2Items: S2.map((it, i) => {\n        const sel = !!st.s2sel[i];\n        const right = sel === it[1];\n        return {\n          text: it[0], mark: sel ? '✓' : '',\n          why: st.s2checked ? (right ? it[2] : 'Look again. ' + it[2]) : '',\n          whyColor: right ? '#24503c' : '#9c3b2e',\n          border: st.s2checked ? (right ? '#cbdccf' : '#f0cfc9') : (sel ? '#1e3a2f' : '#e4ded1'),\n          bg: st.s2checked ? (right ? '#f6faf7' : '#fdf6f4') : '#fff',\n          boxBorder: sel ? '#1e3a2f' : '#ccc5b4', boxBg: sel ? '#1e3a2f' : '#fff',\n          toggle: () => this.setState({ s2sel: Object.assign({}, st.s2sel, { [i]: !st.s2sel[i] }), s2checked: false })\n        };\n      }),\n      s2Unchecked: !st.s2checked, s2Checked: st.s2checked,\n      s2Check: () => this.setState({ s2checked: true }),\n      s2Score: st.s2checked ? s2Right + ' of ' + S2.length + ' right' : 'Tap the ones that belong.',\n\n      s3RoundLabel: round.label,\n      s3Notes: round.notes.map(n => ({ text: n })),\n      s3Draft: st.s3draft, s3Revision: st.s3rev,\n      s3OnDraft: e => this.setState({ s3draft: e.target.value }),\n      s3OnRevision: e => this.setState({ s3rev: e.target.value }),\n      s3ShowGet: !st.s3fb, s3ShowRevise: !!st.s3fb && !st.s3final,\n      s3Feedback: this.decorate(st.s3fb), s3Final: this.decorate(st.s3final),\n      s3GetFeedback: () => this.run({ stage: 'sentence', round: st.s3round, text: st.s3draft, notes: round.notes }, 's3fb'),\n      s3GetFinal: () => this.run({ stage: 'sentence', round: st.s3round, text: st.s3rev, notes: round.notes, isRevision: true }, 's3final'),\n      s3NextLabel: st.s3round < S3.length - 1 ? 'Next sentence' : 'Next: write your paragraph',\n      s3Next: () => {\n        if (st.s3round < S3.length - 1) this.setState({ s3round: st.s3round + 1, s3draft: '', s3fb: null, s3rev: '', s3final: null });\n        else this.setState({ stage: 3 });\n      },\n\n      wordBank: WORD_BANK.map(w => ({ word: w })),\n      s4Draft: st.s4draft, s4Revision: st.s4rev,\n      s4OnDraft: e => this.setState({ s4draft: e.target.value }),\n      s4OnRevision: e => this.setState({ s4rev: e.target.value }),\n      s4Count: sentencesOf(st.s4draft).length + ' of 3 sentences',\n      s4ShowGet: !st.s4fb, s4ShowRevise: !!st.s4fb && !st.s4final,\n      s4Feedback: this.decorate(st.s4fb), s4Final: this.decorate(st.s4final),\n      s4GetFeedback: () => this.run({ stage: 'paragraph', text: st.s4draft, targetSentences: 3 }, 's4fb'),\n      s4GetFinal: () => this.run({ stage: 'paragraph', text: st.s4rev, targetSentences: 3, isRevision: true }, 's4final'),\n      finish: () => { this.saveWork({ finished: true }); this.setState({ view: 'done' }); },\n      doneSummary: 'You sorted facts from opinions, chose what belongs in a report, and wrote a paragraph using facts about black cockatoos.',\n\n      busy: st.busy,\n      busyLabelFirst: st.busy ? 'Reading your writing…' : 'Get feedback',\n      busyLabelFinal: st.busy ? 'Reading your writing…' : 'Get final feedback',\n\n      pwInput: st.pwInput, pwError: st.pwError,\n      onPwInput: e => this.setState({ pwInput: e.target.value, pwError: false }),\n      onPwKey: e => { if (e.key === 'Enter') this.teacherLoginFn(); },\n      teacherLogin: () => this.teacherLoginFn(),\n      teacherCount: workList.length + (workList.length === 1 ? ' student' : ' students'),\n      teacherEmpty: workList.length === 0, hasWork: workList.length > 0,\n      teacherRows: workList.map(w => {\n        const pieces = [];\n        S3.forEach((r, i) => {\n          if (w['s3draft' + i]) pieces.push({ label: r.label + ' · first try', text: w['s3draft' + i] });\n          if (w['s3rev' + i]) pieces.push({ label: r.label + ' · rewrite', text: w['s3rev' + i] });\n        });\n        if (w.s4draft) pieces.push({ label: 'Paragraph · first try', text: w.s4draft });\n        if (w.s4rev) pieces.push({ label: 'Paragraph · rewrite', text: w.s4rev });\n        const all = (w.s4rev || w.s4draft || '');\n        const ops = OPINION_WORDS.filter(o => (' ' + all.toLowerCase() + ' ').indexOf(' ' + o) > -1);\n        return {\n          name: w.username,\n          meta: (w.finished ? 'handed in' : 'in progress') + ' · ' + new Date(w.updatedAt || Date.now()).toLocaleString() + ' · ' + (w.source || 'this device'),\n          flags: ops.length ? 'opinion language: ' + ops.slice(0, 3).join(', ') : '',\n          pieces: pieces.length ? pieces : [{ label: 'No writing yet', text: '—' }]\n        };\n      }),\n      apiInput: st.apiInput,\n      onApiInput: e => this.setState({ apiInput: e.target.value }),\n      apiStatus: st.apiBase\n        ? 'Connected to ' + st.apiBase + '. Student work from every iPad is collected here, and feedback comes from your server. If it stops answering, the built-in checker takes over and work is held on each iPad.'\n        : 'Using the built-in checker, and student work stays on whichever iPad it was written on. Paste your Render address below to turn on AI feedback and collect the whole class here.',\n      serverStatus: st.serverStatus,\n      refreshServer: () => this.loadClassFromServer(),\n      showRefresh: !!st.apiBase,\n      saveApi: () => {\n        const v = st.apiInput.trim();\n        try { localStorage.setItem(API_KEY, v); } catch (e) {}\n        this.setState({ apiBase: v }, () => this.loadClassFromServer());\n      },\n      clearApi: () => {\n        try { localStorage.removeItem(API_KEY); } catch (e) {}\n        this.setState({ apiBase: '', apiInput: '' });\n      },\n      printPage: () => window.print(),\n      clearWork: () => { this.saveAll({ work: {} }); this.setState({ work: {} }); },\n      exportCsv: () => {\n        const head = ['Username', 'Status', 'Updated', 'Sentence 1 first', 'Sentence 1 rewrite', 'Sentence 2 first', 'Sentence 2 rewrite', 'Sentence 3 first', 'Sentence 3 rewrite', 'Paragraph first', 'Paragraph rewrite'];\n        const lines = [head];\n        workList.forEach(w => lines.push([w.username, w.finished ? 'handed in' : 'in progress', new Date(w.updatedAt || Date.now()).toLocaleString(),\n          w.s3draft0 || '', w.s3rev0 || '', w.s3draft1 || '', w.s3rev1 || '', w.s3draft2 || '', w.s3rev2 || '', w.s4draft || '', w.s4rev || '']));\n        const csv = lines.map(r => r.map(c => '\"' + String(c).replace(/\"/g, '\"\"') + '\"').join(',')).join('\\n');\n        const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));\n        const a = document.createElement('a');\n        a.href = url; a.download = 'writing-information-reports.csv';\n        document.body.appendChild(a); a.click(); a.remove();\n        setTimeout(() => URL.revokeObjectURL(url), 4000);\n      }\n    };\n  }\n\n  startFn() {\n    const name = (document.getElementById('uname') || {}).value || this.state.nameInput;\n    const v = String(name || '').trim();\n    if (!/^[A-Za-z][A-Za-z'-]*\\.[A-Za-z]$/.test(v)) {\n      return this.setState({ nameError: 'Use your first name, a full stop, then the first letter of your surname. Like Bob.W' });\n    }\n    const saved = this.state.work[v] || {};\n    this.setState({\n      view: 'app', username: v, nameError: '',\n      s3draft: '', s3fb: null, s3rev: '', s3final: null,\n      s4draft: saved.s4draft || '', s4fb: null, s4rev: '', s4final: null\n    });\n  }\n\n  teacherLoginFn() {\n    if (this.state.pwInput === (this.props.teacherPassword ?? 'teacher2026')) {\n      this.setState({ view: 'teacher', pwError: false, work: this.load().work || {}, pwUsed: this.state.pwInput },\n        () => this.loadClassFromServer());\n    } else this.setState({ pwError: true });\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
